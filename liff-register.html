<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลงทะเบียนผู้บริจาค – ธนาคารเลือด รพ.ระยอง</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{--red:#B92735;--pink:#FFF5F5;--pink2:#FADADD;--ink:#2A1A1C;--mute:#7A6366}
*{box-sizing:border-box;margin:0}
body{font-family:'Prompt',sans-serif;background:var(--pink);color:var(--ink);min-height:100vh;padding:20px 16px calc(24px + env(safe-area-inset-bottom))}
.card{background:#fff;border-radius:24px;padding:24px 20px;box-shadow:0 4px 18px rgba(185,39,53,.08);max-width:480px;margin:0 auto}
.logo{display:block;width:150px;max-width:55%;height:auto;margin:0 auto 14px}
.icon{width:64px;height:64px;border-radius:50%;background:var(--pink2);display:grid;place-items:center;margin:0 auto 12px}
h1{font-size:22px;font-weight:700;color:var(--red);text-align:center}
.sub{font-size:14px;color:var(--mute);text-align:center;margin:6px 0 20px}
label{display:block;font-size:15px;font-weight:600;margin:16px 0 6px}
input,select{width:100%;font:inherit;font-size:18px;padding:12px 14px;border:1.5px solid var(--pink2);border-radius:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1.4fr 1.2fr;gap:8px}
.hint{font-size:13px;color:var(--mute);margin-top:6px}
.err{font-size:14px;color:var(--red);margin-top:6px;min-height:20px}
button{width:100%;margin-top:20px;font:inherit;font-size:18px;font-weight:600;padding:14px;border:0;border-radius:16px;background:var(--red);color:#fff}
button:disabled{opacity:.55}
.note{font-size:12.5px;color:var(--mute);text-align:center;margin-top:14px;line-height:1.5}
.box{display:none;text-align:center}
.msg{background:var(--pink);border-radius:16px;padding:14px 16px;font-size:15px;line-height:1.55;margin-top:14px;text-align:left;white-space:pre-line}
</style>
</head>

  <h1>ลงทะเบียนครั้งแรก</h1>
  <p class="sub">เพื่อดูผลเลือดด้วยการกดปุ่มเดียวในครั้งต่อไป</p>

  <label for="nid">เลขบัตรประชาชน 13 หลัก</label>
  <input id="nid" type="text" inputmode="numeric" maxlength="13" autocomplete="off" placeholder="กรอกเฉพาะตัวเลข">

  <label>วันเกิด</label>
  <div class="row">
    <select id="dd"></select><select id="mm"></select><select id="yy"></select>
  </div>
  <div class="hint">ปีเกิดเป็น ค.ศ. (เช่น 1990)</div>

  <div class="err" id="err"></div>
  <button id="submitBtn" disabled>ยืนยันตัวตน</button>
  <p class="note">ข้อมูลใช้เพื่อยืนยันตัวตนเท่านั้น ระบบไม่เก็บเลขบัตรประชาชนของท่าน<br>หากมีปัญหา โทร 038-611104 ต่อ 2079, 2080 (เวลาราชการ)</p>
</div>

<div class="card box" id="doneView">
  <div class="icon"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#B92735" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
  <h1>ลงทะเบียนสำเร็จ</h1>
  <div class="msg" id="resultMsg"></div>
  <button id="closeBtn">ปิดหน้านี้</button>
</div>

<script>
// ===== ตั้งค่า (แก้ 2 ค่านี้ก่อนใช้งาน) =====
const LIFF_ID = '2012317577-rTFqCAsp';
const API_URL = 'https://script.google.com/macros/s/AKfycbywTIlcJ0B3GlVncek_RXtSz1gIEenqr0AsTbrExA_1_bLq7Kv2leBZ-h0b-0Goh5ypLw/exec';
const TRIGGER_TEXT = 'ผลเลือด'; // ข้อความที่ส่งเข้าแชต (ต้องตรงกับที่หลังบ้านรอรับ และปุ่ม Rich Menu)

const $ = id => document.getElementById(id);
const MONTHS = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// สร้างตัวเลือก วัน/เดือน/ปี (ปี ค.ศ. อายุ 16-80)
function fillSelect(el, label, items){
  el.innerHTML = '<option value="">' + label + '</option>' + items.map(i => `<option value="${i[0]}">${i[1]}</option>`).join('');
}
fillSelect($('dd'), 'วัน', Array.from({length:31}, (_, i) => [i+1, i+1]));
fillSelect($('mm'), 'เดือน', MONTHS.map((m, i) => [i+1, m]));
const thisYear = new Date().getFullYear();
fillSelect($('yy'), 'ปี ค.ศ.', Array.from({length:65}, (_, i) => [thisYear-16-i, thisYear-16-i]));

// ตรวจเลขบัตรประชาชนไทย (checksum mod 11)
function validNid(s){
  if(!/^\d{13}$/.test(s)) return false;
  let sum = 0;
  for(let i = 0; i < 12; i++) sum += +s[i] * (13 - i);
  return (11 - sum % 11) % 10 === +s[12];
}

function checkReady(){
  $('submitBtn').disabled = !($('nid').value.length === 13 && $('dd').value && $('mm').value && $('yy').value);
}
['nid','dd','mm','yy'].forEach(id => $(id).addEventListener('input', checkReady));
$('nid').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, ''); checkReady(); });

// ส่งข้อความ "ผลเลือด" เข้าแชตแทนผู้ใช้ เพื่อให้บอทตอบกลับแบบ reply (ฟรี ไม่นับโควตา push)
async function sendToChat(){
  try{
    if(liff.isInClient() && liff.isApiAvailable('sendMessages')){
      await liff.sendMessages([{type:'text', text: TRIGGER_TEXT}]);
      liff.closeWindow();
      return;
    }
  }catch(e){ /* ส่งไม่ได้ ใช้ทางสำรองด้านล่าง */ }
  $('resultMsg').textContent += '\n\nกลับไปที่แชต แล้วกดเมนู "สอบถามผลเลือด" เพื่อดูผลค่ะ';
}

async function submitForm(){
  const nid = $('nid').value;
  const y = +$('yy').value, m = +$('mm').value, d = +$('dd').value;
  $('err').textContent = '';

  if(!validNid(nid)){ $('err').textContent = 'เลขบัตรประชาชนไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง'; return; }
  const dt = new Date(y, m-1, d);
  if(dt.getMonth() !== m-1){ $('err').textContent = 'วันเกิดไม่ถูกต้อง'; return; }

  $('submitBtn').disabled = true;
  $('submitBtn').textContent = 'กำลังตรวจสอบ...';
  try{
    // ใช้ text/plain เพื่อเลี่ยง CORS preflight ของ Apps Script
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: 'register',
        idToken: liff.getIDToken(),   // หลังบ้านต้อง verify กับ LINE
        nationalId: nid,
        birthdate: `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}` // ค.ศ. YYYY-MM-DD
      })
    });
    const data = await res.json();
    if(data.ok){
      $('nid').value = '';           // ล้างข้อมูลสำคัญทันที
      $('resultMsg').textContent = data.message || 'ลงทะเบียนสำเร็จ กำลังส่งผลเลือดให้ในแชต';
      $('formView').style.display = 'none';
      $('doneView').style.display = 'block';
      sendToChat();
    }else{
      $('err').textContent = data.message || 'ไม่พบข้อมูล กรุณาตรวจสอบอีกครั้ง';
    }
  }catch(e){
       $('err').textContent = 'เชื่อมต่อไม่ได้: ' + e.message;
  }
  $('submitBtn').textContent = 'ยืนยันตัวตน';
  checkReady();
}

async function init(){
  try{
    await liff.init({liffId: LIFF_ID});
    if(!liff.isLoggedIn()){ liff.login(); return; }
    $('submitBtn').addEventListener('click', submitForm);
    $('closeBtn').addEventListener('click', () => liff.closeWindow());
  }catch(e){
    $('err').textContent = 'เปิดหน้านี้ผ่านแอป LINE เท่านั้น';
  }
}
init();
</script>
</body>
</html>
